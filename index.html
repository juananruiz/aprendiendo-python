<!DOCTYPE html>
<html>
<head>
    <title>Contador</title>
</head>
<body>
    <h1>Contador</h1>
    <form method="POST">
        <input type="number" name="initial_value" placeholder="Valor inicial">
        <button type="submit">Iniciar</button>
    </form>
    <p>Contador: <span id="count">{{ count }}</span></p>
    <button onclick="increment()">Incrementar</button>
    <button onclick="decrement()">Decrementar</button>
    <script>
        function increment() {
            fetch('/increment')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('count').textContent = data;
                });
        }

        function decrement() {
            fetch('/decrement')
            .then(response => response.text())
            .then(data => {
                document.getElementById('count').textContent = data;
            });
        }
    </script>
</body>
</html>
